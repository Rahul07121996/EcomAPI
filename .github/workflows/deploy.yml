name: Deploy to Azure With Docker

on:
  push:
    branches: [master]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/ecomapi:${{ github.sha }} -t ${{ secrets.ACR_NAME }}.azurecr.io/ecomapi:latest.

      - name: Push Image to ACR
        run: |
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/ecomapi:${{ github.sha }}
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/ecomapi:latest

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          images: ${{ secrets.ACR_NAME }}.azurecr.io/ecomapi:${{ github.sha }}